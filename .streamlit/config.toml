# SEED Design (당근) 라이트 모드 색상 — @seed-design/css 토큰 값
[theme]
base = "light"
primaryColor = "#FF6600"             # carrot-600 (bg-brand-solid)
backgroundColor = "#FFFFFF"          # bg-layer-default
secondaryBackgroundColor = "#F3F4F5" # gray-200 (bg-neutral-weak)
textColor = "#1A1C20"                # gray-1000 (fg-neutral)
font = "sans serif"

[client]
toolbarMode = "minimal"
